# Apache overrides for the docroot, enabled via a2enconf in the Dockerfile.
#
# Debian's stock apache2.conf ships `<Directory /var/www/>` with
# `AllowOverride None` and `Options Indexes FollowSymLinks`, and the
# wordpress base image does not change it (verified by reading
# /etc/apache2/apache2.conf and /etc/apache2/conf-enabled/ in the image).
# Both defaults are wrong here.
<Directory /var/www/html/>
    # AllowOverride None makes WordPress's .htaccess inert. mod_rewrite is
    # enabled in the base image, but without this every pretty permalink --
    # including /find-courses/, which the whole front end is built around --
    # returns 404, while the admin's Permalinks screen still cheerfully
    # reports the rules as saved. `wp rewrite flush --hard` in
    # .docker/init.sh writes the .htaccess this makes effective.
    AllowOverride All

    # Indexes turns any directory without an index file into a browsable
    # listing -- wp-content/uploads/ being the obvious one. Nothing here
    # relies on it.
    Options -Indexes +FollowSymLinks

    Require all granted

    # WordPress's front-controller routing, in server config rather than in
    # a generated .htaccess.
    #
    # These are the same four directives WordPress writes into .htaccess,
    # kept here because that file never gets written in this image:
    # `wp rewrite flush --hard` declines with "Regenerating a .htaccess file
    # requires special configuration" whenever got_mod_rewrite() is false,
    # and it is always false under WP-CLI -- $is_apache is derived from
    # $_SERVER['SERVER_SOFTWARE'], which the CLI SAPI does not set. Init runs
    # entirely through WP-CLI, so relying on that call would have left the
    # site with no .htaccess at all and every pretty permalink returning 404
    # -- including /find-courses/, with the admin's Permalinks screen still
    # showing the structure as saved.
    #
    # Putting them here is also the better fit for an immutable image: the
    # rules ship with the build instead of being generated at runtime into a
    # filesystem that is thrown away on the next deploy.
    RewriteEngine On
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /index.php [L]
</Directory>

# The Composer autoloader and the second copy of the plugin source live at
# /var/www/html/vendor and /var/www/html/plugins (see the Dockerfile for why
# that path is forced). Both sit inside the docroot, so both are reachable
# over HTTP by default -- serving raw PHP source to anyone who guesses the
# path. They are only ever loaded from disk by PHP, never fetched, so deny
# them outright.
<DirectoryMatch "^/var/www/html/(vendor|plugins)/">
    Require all denied
</DirectoryMatch>
